# Weekly update pull requests, grouped so there is one per ecosystem instead of one per
# package. Each one goes through the full pipeline (tests, Trivy gate, smoke test).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
